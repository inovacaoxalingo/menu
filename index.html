  { id: "ra",      titulo: "Realidade aumentada", texto: "Veja o brinquedo ganhar vida na câmera", link: "https://inovacaoxalingo.github.io/interactive-play/", cor: "laranja", icone: "ra", novo: true },
  { id: "manuais", titulo: "Manuais",             texto: "Regras e instruções de montagem",        link: "https://xalingo.com.br/manuais", cor: "verde",     icone: "manual" },

  { id: "insta",   titulo: "Instagram",           texto: "@xalingobrinquedos",                     link: "https://www.instagram.com/xalingobrinquedos/", cor: "azulclaro", icone: "insta" }
];

<style>
  :root{
    --azul:#164194; --amarelo:#E3B500; --vermelho:#E10000;
    --verde:#60D437; --azulclaro:#00A1FF; --laranja:#FF9200;
    --marinho:#0E2A66; --fundo:#EAF2FF; --suave:#4A5878; --linha:#CFDDF5;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--marinho); min-height:100vh;
    font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    background-color:var(--fundo);
    background-image:
      radial-gradient(circle at 12px 12px, rgba(22,65,148,.07) 2.5px, transparent 3px);
    background-size:28px 28px;
  }

  /* ---------- topo azul com formas de blocos ---------- */
  header{position:relative; overflow:hidden; background:var(--azul); color:#fff; text-align:center; padding:26px 20px 64px}
  .topo{position:relative; z-index:2; max-width:720px; margin:0 auto}
  .logo{display:block; margin:0 auto; width:min(250px,68%); height:auto; filter:drop-shadow(0 6px 14px rgba(0,0,0,.22))}
  h1{margin:20px 0 4px; font-size:27px; line-height:1.15; font-weight:800}
  .sub{margin:0; font-size:15px; opacity:.92}
  .onda{position:absolute; left:0; right:0; bottom:-1px; width:100%; height:46px; z-index:1; display:block}
  .forma{position:absolute; z-index:0; animation:flutua 7s ease-in-out infinite}
  .f1{left:-22px; top:34px; width:74px; height:74px; border-radius:50%; background:var(--amarelo)}
  .f2{right:-18px; top:18px; width:64px; height:64px; border-radius:14px; background:var(--vermelho); transform:rotate(14deg); animation-delay:-2s}
  .f3{left:-8px; bottom:74px; width:0; height:0; border-left:24px solid transparent; border-right:24px solid transparent; border-bottom:40px solid var(--verde); animation-delay:-4s}
  .f4{right:-14px; bottom:84px; width:46px; height:46px; border-radius:50%; background:var(--laranja); animation-delay:-1s}
  .f5{right:24%; top:-16px; width:44px; height:44px; border-radius:12px; background:var(--azulclaro); transform:rotate(-12deg); animation-delay:-3s}
  .f6{left:26%; top:-22px; width:52px; height:52px; border-radius:50%; background:var(--azulclaro); opacity:.55; animation-delay:-5s}
  @keyframes flutua{ 0%,100%{translate:0 0} 50%{translate:0 -9px} }

  /* ---------- botões grandes ---------- */
  main{max-width:720px; margin:-34px auto 0; padding:0 14px 28px; position:relative; z-index:3}
  .grade{display:grid; gap:12px; grid-template-columns:1fr 1fr}
  @media (min-width:620px){ .grade{grid-template-columns:repeat(4,1fr)} }
  .bloco{
    position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start;
    min-height:176px; padding:14px 14px 16px; border-radius:22px;
    color:var(--marinho); text-decoration:none;
    box-shadow:0 5px 0 rgba(14,42,102,.22), 0 12px 22px rgba(14,42,102,.14);
    transition:transform .12s ease, box-shadow .12s ease;
    animation:entra .45s cubic-bezier(.2,.9,.3,1.2) backwards;
  }
  .bloco:nth-child(2){animation-delay:.06s} .bloco:nth-child(3){animation-delay:.12s} .bloco:nth-child(4){animation-delay:.18s}
  @keyframes entra{ from{opacity:0; transform:translateY(18px) scale(.94)} }
  .bloco::after{content:""; position:absolute; right:-34px; bottom:-34px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.2)}
  .bloco::before{content:""; position:absolute; right:38px; top:-22px; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.16)}
  a.bloco:hover{transform:translateY(-3px)}
  a.bloco:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(14,42,102,.22), 0 4px 10px rgba(14,42,102,.14)}
  a.bloco:focus-visible, a.linha:focus-visible{outline:4px solid var(--marinho); outline-offset:3px}
  .bloco.azul{background:var(--azul); color:#fff}
  .bloco.vermelho{background:var(--vermelho); color:#fff}
  .bloco.amarelo{background:var(--amarelo)}
  .bloco.verde{background:var(--verde)}
  .bloco.azulclaro{background:var(--azulclaro)}
  .bloco.laranja{background:var(--laranja)}
  .bolha{
    position:relative; z-index:1; width:62px; height:62px; border-radius:50%; background:#fff; color:var(--azul);
    display:grid; place-items:center; box-shadow:0 3px 0 rgba(14,42,102,.18);
  }
  .bolha svg{width:34px; height:34px}
  .bloco b{position:relative; z-index:1; margin-top:auto; padding-top:14px; font-size:19px; line-height:1.15; font-weight:800}
  .bloco small{position:relative; z-index:1; margin-top:4px; font-size:13px; line-height:1.3; font-weight:400}
  .selo{
    position:absolute; z-index:2; top:14px; right:12px; padding:4px 10px; border-radius:99px;
    font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-style:normal;
    background:#fff; color:var(--marinho);
  }
  .selo.novo{background:var(--vermelho); color:#fff}
  .embreve .bolha{opacity:.85}

  /* ---------- área dos adultos (discreta) ---------- */
  .adultos{margin-top:28px; padding:16px 14px 14px; background:#fff; border:1px solid var(--linha); border-radius:22px}
  .adultos h2{margin:0 4px 10px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--suave)}
  .linhas{display:grid; gap:8px; grid-template-columns:1fr}
  @media (min-width:620px){ .linhas{grid-template-columns:1fr 1fr} }
  .linha{display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:var(--fundo); color:inherit; text-decoration:none}
  a.linha:hover{background:#DCE9FF}
  .linha .ico{flex:0 0 46px; width:46px; height:46px; border-radius:12px; display:grid; place-items:center; color:var(--marinho)}
  .linha .ico svg{width:26px; height:26px}
  .linha.azul .ico{background:var(--azul); color:#fff} .linha.vermelho .ico{background:var(--vermelho); color:#fff}
  .linha.amarelo .ico{background:var(--amarelo)} .linha.verde .ico{background:var(--verde)}
  .linha.azulclaro .ico{background:var(--azulclaro)} .linha.laranja .ico{background:var(--laranja)}
  .linha .txt{flex:1; min-width:0}
  .linha .txt b{display:block; font-size:16px; color:var(--azul)}
  .linha .txt span{display:block; font-size:13px; color:var(--suave)}
  .linha .seta{color:var(--azul); opacity:.6}
  .linha .seta svg{width:20px; height:20px; display:block}
  .linha .selo{position:static; background:var(--linha)}

  footer{max-width:720px; margin:0 auto; padding:0 20px 34px; text-align:center; color:var(--suave); font-size:13px}
  footer a{color:var(--azul); font-weight:700}
  .cores{display:flex; justify-content:center; gap:6px; margin-bottom:10px}
  .cores i{width:10px; height:10px; border-radius:50%}

  @media (prefers-reduced-motion:reduce){ .forma,.bloco{animation:none} .bloco{transition:none} }
</style>
</head>

    contato:'<path d="M4 6.5h16v9.5H10l-4 3.5V16H4z"/>'
  };
  function svg(nome, peso){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(peso||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONES[nome]||ICONES.catalogo)+'</svg>';
  }
  var SETA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function alvo(link){
    return /^https?:\/\/((www\.)?xalingo\.com\.br|inovacaoxalingo\.github\.io)/.test(link) ? '' : ' target="_blank" rel="noopener"';
  }

  // origem da leitura: xalingo.com.br/menu?o=embalagem, ?o=banner ...
  var origem = (new URLSearchParams(location.search).get('o') || 'direto').slice(0,30);

  document.getElementById('principal').innerHTML = PRINCIPAL.map(function(it){
    var ativo = !!it.link;
    var selo = !ativo ? '<em class="selo">Em breve</em>' : (it.novo ? '<em class="selo novo">Novo</em>' : '');
    var miolo = '<span class="bolha">'+svg(it.icone)+'</span>'+selo+'<b>'+esc(it.titulo)+'</b><small>'+esc(it.texto)+'</small>';
    return ativo
      ? '<a class="bloco '+esc(it.cor)+'" href="'+esc(it.link)+'" data-id="'+esc(it.id)+'"'+alvo(it.link)+'>'+miolo+'</a>'
      : '<div class="bloco embreve '+esc(it.cor)+'" aria-disabled="true">'+miolo+'</div>';
  }).join('');

  if(!ADULTOS.length){ document.getElementById('secAdultos').hidden = true; }
  document.getElementById('adultos').innerHTML = ADULTOS.map(function(it){
    var ativo = !!it.link;
    var miolo = '<span class="ico">'+svg(it.icone,1.8)+'</span><span class="txt"><b>'+esc(it.titulo)+'</b><span>'+esc(it.texto)+'</span></span>'+
                (ativo ? '<span class="seta">'+SETA+'</span>' : '<em class="selo">Em breve</em>');
    return ativo
      ? '<a class="linha '+esc(it.cor)+'" href="'+esc(it.link)+'" data-id="'+esc(it.id)+'"'+alvo(it.link)+'>'+miolo+'</a>'
      : '<div class="linha '+esc(it.cor)+'" aria-disabled="true">'+miolo+'</div>';
  }).join('');

  // mede qual botão foi tocado (só funciona depois de ligar o GA4 lá em cima)
  document.querySelector('main').addEventListener('click', function(e){
    var a = e.target.closest('a[data-id]');
    if(a && typeof window.gtag === 'function'){
      window.gtag('event','menu_clique',{ item: a.dataset.id, origem: origem, transport_type:'beacon' });
    }
  });
})();
</script>
</body>
</html>
