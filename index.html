<style>
  :root{
    --azul:#164194; --amarelo:#E3B500; --vermelho:#E10000;
    --verde:#60D437; --azulclaro:#00A1FF; --laranja:#FF9200;
    --marinho:#0E2A66; --fundo:#EAF2FF; --suave:#4A5878; --linha:#CFDDF5;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--marinho); min-height:100vh;
    font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    background:#eaf3ff;
  }

  /* ---------- topo azul com formas de blocos ---------- */

/* ===== família Xalingo: topo, faixa de cor, Veja também e rodapé (iguais em Menu, Manuais, Jogos e RA) ===== */
.fx-top{position:relative;background:linear-gradient(160deg,#0a1f4f,#164194 70%);color:#fff}
.fx-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--fx-cor,#FF9200)}
.fx-top.fx-arco::after{background:linear-gradient(90deg,#00A1FF 0 20%,#60D437 0 40%,#E3B500 0 60%,#FF9200 0 80%,#E10000 0)}
.fx-row{display:flex;align-items:center;gap:14px;min-height:46px}
.fx-logo{display:block;flex:none;line-height:0}.fx-logo img{width:150px;height:auto;display:block}
.fx-sec{display:flex;align-items:center;gap:9px;min-width:0;padding-left:14px;border-left:1.5px solid rgba(255,255,255,.28)}
.fx-sec i{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--fx-cor,#FF9200);color:#0f2350}
.fx-sec i svg{width:19px;height:19px}
.fx-sec b{font:800 21px/1.1 "Open Sans",system-ui,sans-serif;letter-spacing:-.3px;color:#fff}
.fx-esp{flex:1}
.fx-menu{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);
  color:#fff;text-decoration:none;font:800 14px "Open Sans",system-ui,sans-serif;border:1.5px solid rgba(255,255,255,.25)}
.fx-menu svg{width:18px;height:18px}.fx-menu:hover{background:rgba(255,255,255,.24)}
.fx-veja{max-width:1240px;margin:34px auto 0;padding:0 24px}
.fx-veja h2{margin:0 0 12px;font:800 21px "Open Sans",system-ui,sans-serif;color:#164194}
.fx-veja .fx-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.fx-veja a{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:#fff;text-decoration:none;color:#0f2350;
  box-shadow:0 8px 24px rgba(14,44,107,.1);transition:transform .12s}
.fx-veja a:hover{transform:translateY(-2px)}
.fx-veja a i{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:#0f2350}
.fx-veja a i svg{width:28px;height:28px}
.fx-veja a b{display:block;font:800 16px "Open Sans",system-ui,sans-serif;color:#164194}
.fx-veja a span{display:block;font:400 13px "Open Sans",system-ui,sans-serif;color:#56648a;margin-top:1px}
.fx-veja a em{margin-left:auto;font-style:normal;font-weight:800;color:#164194;opacity:.5}
.fx-rod{padding:24px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;font:400 13px/1.6 "Open Sans",system-ui,sans-serif;color:#56648a}
.fx-rod .fx-pt{display:flex;justify-content:center;gap:6px;margin-bottom:10px}.fx-rod .fx-pt i{width:9px;height:9px;border-radius:50%}
.fx-rod a{color:#164194;font-weight:700;text-decoration:none}
@media (max-width:640px){
  .fx-row{gap:10px}.fx-logo img{width:108px}.fx-sec{padding-left:10px;gap:7px}.fx-sec i{width:26px;height:26px;border-radius:8px}.fx-sec i svg{width:16px;height:16px}
  .fx-sec b{font-size:16.5px}.fx-menu{width:40px;padding:0;justify-content:center}.fx-menu span{display:none}
  .fx-veja{padding:0 16px}.fx-veja h2{font-size:19px}
}

  header.fx-top{overflow:hidden; padding:calc(18px + env(safe-area-inset-top)) 24px 30px}
  .topo{position:relative; z-index:2; max-width:720px; margin:0 auto}
  .hero{text-align:center; padding-top:12px}

  .f5{right:30%; top:-26px; width:44px; height:44px; border-radius:12px; background:var(--azulclaro); transform:rotate(-12deg); animation-delay:-3s}
  .f6{left:34%; top:-34px; width:52px; height:52px; border-radius:50%; background:var(--azulclaro); opacity:.55; animation-delay:-5s}

  /* ---------- botões grandes ---------- */
  main{max-width:720px; margin:0 auto; padding:22px 14px 10px; position:relative; z-index:3}
  .grade{display:grid; gap:12px; grid-template-columns:1fr 1fr}

  .bloco{
    position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start;
    min-height:176px; padding:14px 14px 16px; border-radius:22px;
    color:var(--marinho); text-decoration:none;
    box-shadow:0 5px 0 rgba(14,42,102,.22), 0 12px 22px rgba(14,42,102,.14);
    transition:transform .12s ease, box-shadow .12s ease;
    animation:entra .45s cubic-bezier(.2,.9,.3,1.2) backwards;
  }
  .bloco:nth-child(2){animation-delay:.06s} .bloco:nth-child(3){animation-delay:.12s} .bloco:nth-child(4){animation-delay:.18s}
  @keyframes entra{ from{opacity:0; transform:translateY(18px) scale(.94)} }
  .bloco::after{content:""; position:absolute; right:-34px; bottom:-34px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.2)}

  a.bloco:hover{transform:translateY(-3px)}
  a.bloco:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(14,42,102,.22), 0 4px 10px rgba(14,42,102,.14)}
  a.bloco:focus-visible, a.linha:focus-visible{outline:4px solid var(--marinho); outline-offset:3px}
  .bloco.azul{background:var(--azul); color:#fff}
  .bloco.vermelho{background:var(--vermelho); color:#fff}
  .bloco.amarelo{background:var(--amarelo)}
  .bloco.verde{background:var(--verde)}
  .bloco.azulclaro{background:var(--azulclaro)}
  .bloco.laranja{background:var(--laranja)}

    position:relative; z-index:1; width:62px; height:62px; border-radius:50%; background:#fff; color:var(--azul);

  }
  .bolha svg{width:34px; height:34px}
  .bloco b{position:relative; z-index:1; margin-top:auto; padding-top:14px; font-size:19px; line-height:1.15; font-weight:800}
  .bloco small{position:relative; z-index:1; margin-top:4px; font-size:13px; line-height:1.3; font-weight:400}
  .selo{
    position:absolute; z-index:2; top:14px; right:12px; padding:4px 10px; border-radius:99px;
    font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-style:normal;
    background:#fff; color:var(--marinho);
  }
  .selo.novo{background:var(--vermelho); color:#fff}
  .embreve .bolha{opacity:.85}

  /* ---------- área dos adultos (discreta) ---------- */
  .adultos{margin-top:28px; padding:16px 14px 14px; background:#fff; border:1px solid var(--linha); border-radius:22px}

  .linha .ico svg{width:26px; height:26px}
  .linha.azul .ico{background:var(--azul); color:#fff} .linha.vermelho .ico{background:var(--vermelho); color:#fff}
  .linha.amarelo .ico{background:var(--amarelo)} .linha.verde .ico{background:var(--verde)}
  .linha.azulclaro .ico{background:var(--azulclaro)} .linha.laranja .ico{background:var(--laranja)}

  /* ---------- busca ---------- */
  .busca{margin:18px auto 0; max-width:520px}

    border-radius:16px; box-shadow:0 8px 24px rgba(10,31,79,.18); cursor:text}
  .busca .caixa:focus-within{box-shadow:0 8px 24px rgba(10,31,79,.18), 0 0 0 3px var(--azulclaro)}

  /* ---------- enfeite só no computador: brinquedos e cartões nas laterais ---------- */

    main{z-index:3}
  }

  /* celular: busca logo abaixo do logo (igual RA, Jogos e Manuais); o "Vamos brincar?" desce para cima dos botões */
  .saud{display:none}

<body>

<header class="fx-top fx-arco">
  <span class="forma f1"></span><span class="forma f2"></span><span class="forma f3"></span>

      ? '<img src="' + esc(it.foto) + '" alt="" loading="lazy" onerror="this.parentNode.innerHTML=window.iconeSvg?window.iconeSvg(\'' + ic + '\',1.9):\'\'">'
      : icone(ic);
    var sub = it.ref ? 'ref. ' + fmtRef(it.ref) : 'Jogo on-line';
    var corpo;
    if (it.tem) {
      var c = '';
      if (it.man) c += chip('man', it.manTxt, it.man, it.ref);
      if (it.vid) c += chip('vid', 'Vídeo', it.vid, it.ref);
      it.jogos.forEach(function(j){ c += chip('jogo', it.jogos.length > 1 ? j.nome : 'Jogo digital', j.url, it.ref, 'Jogo ' + j.nome); });
      if (it.ra) c += chip('ra', 'Realidade aumentada', it.ra, it.ref);
      corpo = '<div class="chips">' + c + '</div>';
    } else {
      corpo = '<p class="nada">Ainda não tem manual, vídeo ou jogo on-line.</p>';
    }
    return '<article class="res' + (it.tem ? '' : ' sem') + '"><span class="foto">' + foto + '</span>' +
           '<div class="info"><b>' + esc(it.nome) + '</b><small>' + esc(sub) + '</small>' + corpo + '</div></article>';
  }

  /* ---- medição da busca (GA4): manda o termo depois que a pessoa para de digitar ---- */
  var ultimoMedido = '', esperaMed;
  function termoLimpo(q){
    var t = sem(q).replace(/\s+/g, ' ').trim().slice(0, 40);
    if (/@/.test(t) || /\d{9,}/.test(t.replace(/[\s.\-]/g, ''))) return '[removido]';   /* nada de e-mail ou telefone */
    return t;
  }
  function medeBusca(q, total, comConteudo, agora){
    clearTimeout(esperaMed);
    var t = termoLimpo(q);
    window.xalBuscaTermo = t;
    if (t.length < 2 || t === ultimoMedido) return;
    esperaMed = setTimeout(function(){
      ultimoMedido = t;
      if (window.xalMede) window.xalMede('search', { search_term: t, resultados: total, com_conteudo: comConteudo });
    }, agora ? 0 : 1500);
  }

  function mostra(agora){
    var q = campo.value;
    limpa.hidden = !q;
    var r = procura(q);
    if (r === null) { clearTimeout(esperaMed); res.hidden = true; res.innerHTML = ''; inicio.hidden = false; return; }
    inicio.hidden = true; res.hidden = false;
    medeBusca(q, r.length, r.filter(function(it){ return it.tem; }).length, agora === true);
    if (!r.length) {
      res.innerHTML = '<div class="vazio"><b>Não encontramos “' + esc(q.trim()) + '”.</b>' +
        'Tente outro nome do brinquedo ou a ref. que está na caixa (ex.: 0998.7).</div>';
      return;
    }
    var com = r.filter(function(it){ return it.tem; });
    var sem_ = r.filter(function(it){ return !it.tem; });
    var lim = mostrarTodos ? 1e9 : LIMITE;
    var h = '<p class="conta"><b>' + com.length + '</b> ' + (com.length === 1 ? 'brinquedo com conteúdo' : 'brinquedos com conteúdo') +
            ' para “' + esc(q.trim()) + '”</p>';
    h += com.slice(0, lim).map(cartao).join('');
    if (com.length > lim) h += '<button type="button" class="mais" id="qMais">Ver todos (' + com.length + ')</button>';
    if (sem_.length && (mostrarTodos || com.length <= lim)) {
      var ls = mostrarTodos ? sem_ : sem_.slice(0, 3);
      h += '<h3>' + (com.length ? 'Também encontramos' : 'Encontramos') + '</h3>' + ls.map(cartao).join('');
      if (sem_.length > ls.length) h += '<button type="button" class="mais" id="qMais">Ver todos (' + r.length + ')</button>';
    }
    res.innerHTML = h;
    var b = document.getElementById('qMais');
    if (b) b.onclick = function(){ mostrarTodos = true; mostra(); };
  }

  /* --------- leitura ao vivo dos sites (só quando alguém usa a busca) --------- */
  function pegaConst(t, nome){
    var m = new RegExp('const\\s+' + nome + '\\s*=\\s*').exec(t);
    if (!m) throw new Error('sem ' + nome);
    var i = m.index + m[0].length, abre = t.charAt(i);
    if (abre !== '[' && abre !== '{') throw new Error('formato ' + nome);
    var prof = 0, str = false, j = i;
    for (; j < t.length; j++) {
      var c = t.charAt(j);
      if (str) { if (c === '\\') { j++; } else if (c === '"') { str = false; } continue; }
      if (c === '"') { str = true; continue; }
      if (c === '[' || c === '{') prof++;
      else if (c === ']' || c === '}') { prof--; if (prof === 0) break; }
    }
    return JSON.parse(t.slice(i, j + 1));
  }
  function texto(url){
    return fetch(url, { cache: 'no-cache' }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); });
  }
  var leu = false;
  function aoVivo(){
    if (leu || !window.fetch || !window.Promise) return;
    leu = true;
    var d = JSON.parse(JSON.stringify(COPIA));
    var a = texto(BASE + 'manuais/').then(function(t){
      ['CATALOGO', 'MANUAIS', 'MANUAL_LINK', 'OCULTOS', 'SEM_MANUAL', 'VIDEOS', 'FOTOS'].forEach(function(k){
        try { d[k] = pegaConst(t, k); } catch (e) {}
      });
    });
    var b = texto(BASE + 'jogos/').then(function(t){
      var D = pegaConst(t, 'D');
      d.JOGOS = D.jogos.map(function(g){
        return { id: g.id, nome: g.nome, ex: g.ex ? 1 : 0, prod: (g.prod || []).map(function(p){ return [p[0], p[1] || '']; }) };
      });
    });
    var c = texto(BASE + 'ra/').then(function(t){
      var lista = [];
      pegaConst(t, 'RA').forEach(function(x){
        if (x.status !== 'ok' || !x.url) return;
        (x.prod || []).forEach(function(p){ if (p[1]) lista.push([p[1], x.url, p[0]]); });
      });
      if (lista.length) d.RA = lista;
    });
    Promise.all([a, b, c].map(function(p){ return p.catch(function(){}); })).then(function(){
      try { monta(d); if (campo.value) mostra(); } catch (e) { monta(COPIA); }
    });
  }

  monta(COPIA);
  var espera;
  campo.addEventListener('focus', aoVivo);
  campo.addEventListener('input', function(){
    mostrarTodos = false; aoVivo();
    clearTimeout(espera); espera = setTimeout(mostra, 120);
  });
  campo.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); mostra(true); campo.blur(); }
    if (e.key === 'Escape') { campo.value = ''; mostra(); }
  });
  limpa.addEventListener('click', function(){ campo.value = ''; mostrarTodos = false; mostra(); campo.focus(); });
})();
</script>
</body>
